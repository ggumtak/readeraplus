name: Build APK

on:
  push:
  workflow_dispatch:
  # Keeps the cached signing key alive: GitHub evicts cache entries not used for 7 days, and a new key would
  # make the next APK refuse to install over the old one (settings lost on reinstall).
  schedule:
    - cron: '23 4 */3 * *'

permissions:
  contents: write

concurrency:
  # The scheduled key keep-alive must never cancel a running build (and vice versa).
  group: build-${{ github.ref }}-${{ github.event_name == 'schedule' && 'keepalive' || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # versionCode = run number: every build is a newer version of the same app.
      BUILD_NUMBER: ${{ github.run_number }}
      # Google Drive copy of the APK: on only when the RCLONE_CONF secret exists (see the upload step).
      GDRIVE_ON: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signing must be the SAME for every build, or Android refuses to install an update over the installed app
      # ("package conflicts") and the user has to uninstall, losing settings and reading positions.
      # Preferred: the repository secrets. Without them: one key generated on the first run and kept in this
      # private repository's Actions cache (never in git), restored by every later build.
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.readeraplus-signing
          key: readeraplus-signing-v2

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_STORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release key from secrets"
            exit 0
          fi
          dir="$HOME/.readeraplus-signing"
          if [ ! -f "$dir/release.keystore" ] || [ ! -f "$dir/pass" ]; then
            echo "::warning::No cached signing key: generating a NEW one. Apps signed by an earlier key must be reinstalled once."
            rm -rf "$dir" && mkdir -p "$dir"
            pass="$(openssl rand -hex 24)"
            printf '%s' "$pass" > "$dir/pass"
            keytool -genkeypair -keystore "$dir/release.keystore" -storetype PKCS12 -alias readeraplus \
              -keyalg RSA -keysize 3072 -validity 36500 -storepass "$pass" -keypass "$pass" \
              -dname "CN=ReaderaPlus" > /dev/null
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          pass="$(cat "$dir/pass")"
          echo "::add-mask::$pass"
          {
            echo "SIGNING_KEYSTORE_FILE=$dir/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$pass"
            echo "SIGNING_KEY_ALIAS=readeraplus"
            echo "SIGNING_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"
          echo "Using the cached signing key"

      - name: Save new signing key
        if: steps.key.outputs.new == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.readeraplus-signing
          key: readeraplus-signing-v2

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Signing certificate
        id: cert
        continue-on-error: true
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          sha="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "Signing certificate SHA-256: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ReaderaPlus-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReaderaPlus-apk
          path: dist/*.apk

      - name: Publish rolling release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "ReaderaPlus build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA} · signing certificate SHA-256 ${{ steps.cert.outputs.sha }}"

      # A copy of the APK in the user's Google Drive (easy to install on the e-reader from the Drive app). Needs the
      # repository secret RCLONE_CONF: the text of an rclone config with one Google Drive remote (made once on a PC
      # with `rclone config`, scope drive.file). The folder is the repository variable GDRIVE_FOLDER (default
      # ReaderaPlus); only the newest ReaderaPlus-<build>.apk is kept there. A Drive failure never fails the build.
      - name: Upload APK to Google Drive
        if: env.GDRIVE_ON == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER: ${{ vars.GDRIVE_FOLDER || 'ReaderaPlus' }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          remote="$(rclone listremotes | head -n 1)"
          [ -n "$remote" ] || { echo "RCLONE_CONF has no remote"; exit 1; }
          apk="ReaderaPlus-${GITHUB_RUN_NUMBER}.apk"
          rclone copy "dist/$apk" "${remote}${GDRIVE_FOLDER}" -q
          # Older builds out, the new one stays.
          rclone delete "${remote}${GDRIVE_FOLDER}" --filter "- $apk" --filter "+ ReaderaPlus-*.apk" --filter "- *" -q || true
          echo "Uploaded $apk to Google Drive: ${GDRIVE_FOLDER}"
          rm -f ~/.config/rclone/rclone.conf

  # Scheduled only: touches the cached signing key so it is never evicted between builds.
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.readeraplus-signing
          key: readeraplus-signing-v2
      - run: ls -la ~/.readeraplus-signing 2>/dev/null | sed -n '1,3p' || echo "no cached signing key"

  # On-demand emulator run (workflow_dispatch, or a commit message containing "[screens]"): drives the app with
  # adb and publishes screenshots + logs to the "ci-screens" prerelease for review.
  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ReaderaPlus-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/screenshots.sh

      # The release below is private to the repository; the artifact and the log lines let a reviewer without a
      # browser session read the crash buffer, the CHECK lines and the UI dumps of failed steps.
      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReaderaPlus-shots
          path: |
            shots/*.txt
            shots/*.xml
            shots/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Print CI findings
        if: always()
        run: |
          [ -d shots ] || exit 0
          echo "::group::crash buffer"; cat shots/crash.txt 2>/dev/null || true; echo "::endgroup::"
          echo "::group::CHECK lines"; grep -h "CHECK" shots/steps.txt 2>/dev/null || true; echo "::endgroup::"
          echo "::group::failed-step UI dumps (text / content-desc)"
          for f in shots/ui_fail_*.xml; do
            [ -f "$f" ] || continue
            echo "-- $f"
            python3 - "$f" <<'PY' || true
          import re, sys
          x = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for m in re.finditer(r'<node [^>]*>', x):
              n = m.group(0)
              t = re.search(r' text="([^"]*)"', n); d = re.search(r'content-desc="([^"]*)"', n)
              c = re.search(r' class="([^"]*)"', n); b = re.search(r'bounds="([^"]*)"', n)
              if (t and t.group(1)) or (d and d.group(1)):
                  print((c.group(1).split(".")[-1] if c else "?"), b.group(1) if b else "", repr(t.group(1) if t else ""), repr(d.group(1) if d else ""))
          PY
          done
          echo "::endgroup::"
          echo "::group::reader log (ReaderaPlus / RAPerf / AndroidRuntime)"
          grep -E "ReaderaPlus|AndroidRuntime|FATAL|RAPerf (show|afterOpen)" shots/logcat.txt 2>/dev/null | tail -400 || true
          echo "::endgroup::"

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || exit 0
          cd shots && zip -q ../shots.zip * && cd ..
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens shots.zip shots/*.png \
            --target "${GITHUB_SHA}" --prerelease \
            --title "CI screenshots (automated test run ${GITHUB_RUN_NUMBER})" \
            --notes "Automated emulator screenshots for development. Not an app release."
