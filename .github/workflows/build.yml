name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signing: prefer the repository secrets. Without them, reuse a debug key kept in the
      # Actions cache so consecutive builds share one signature (updates install in place).
      - name: Restore cached debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: readeraplus-debug-keystore-v1

      - name: Prepare release key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using release key from secrets"
          else
            echo "No signing secrets; using cached debug key"
          fi

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ReaderaPlus-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReaderaPlus-apk
          path: dist/*.apk

      - name: Publish rolling release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "ReaderaPlus build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"

  # On-demand emulator run (workflow_dispatch, or a commit message containing "[screens]"): drives the app with
  # adb and publishes screenshots + logs to the "ci-screens" prerelease for review.
  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ReaderaPlus-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/screenshots.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || exit 0
          cd shots && zip -q ../shots.zip * && cd ..
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens shots.zip shots/*.png \
            --target "${GITHUB_SHA}" --prerelease \
            --title "CI screenshots (automated test run ${GITHUB_RUN_NUMBER})" \
            --notes "Automated emulator screenshots for development. Not an app release."
